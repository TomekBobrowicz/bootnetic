---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bootnetic
description: Custom Fedora Kinoite image

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # ============================================================
  # COPR repositories
  # ============================================================
  - type: dnf
    repos:
      copr:
        - peterwu/iosevka
        - theblackdon/kineticwe
        - lionheartp/Hyprland
        - linuxgamerlife/lgl-dnf-helper
        - linuxgamerlife/lgl-emoji-picker

  # ============================================================
  # KineticWE
  # ============================================================
  - type: script
    snippets:
      - |
        set -eux

        echo "=== Installing Terra repository ==="

        curl -sL \
          https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo \
          -o /etc/yum.repos.d/terra.repo

        echo "=== Replacing kwin-common with KineticWE ==="

        rpm-ostree override replace \
          --experimental \
          --from repo='copr:copr.fedorainfracloud.org:theblackdon:kineticwe' \
          kwin-common \
          || dnf swap -y kwin-common kineticwe

  # ============================================================
  # RPM packages
  # ============================================================
  - type: rpm-ostree
    install:
      - noctalia-git
      - qt5ct
      - qt6ct
      - nwg-look
      - adw-gtk3-theme
      - kitty
      - fish
      - lgl-emoji-picker
      - lgl-dnf-helper
      - iosevka-fonts
      - fastfetch
      - btop
      - htop
      - git
      - zoxide
      - eza
      - gwenview
      - haruna
      - zathura
      - neovim

    remove:
      - firefox
      - firefox-langpacks

  # ============================================================
  # System-wide Flatpaks
  # ============================================================
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.google.Chrome
          - org.equicord.equibop

  # ============================================================
  # Homebrew
  # ============================================================
  - type: brew

  # ============================================================
  # Nix bootstrap
  # ============================================================
  - type: script
    snippets:
      - |
        set -eux

        echo "========================================"
        echo " Preparing Nix directories"
        echo "========================================"

        mkdir -p /var/nix
        mkdir -p /nix
        mkdir -p /var/lib

        chmod 755 /var/nix
        chmod 755 /nix

        echo "========================================"
        echo " Creating Nix bind mount"
        echo "========================================"

        mkdir -p /etc/systemd/system

        cat > /etc/systemd/system/nix.mount <<'EOF'
        [Unit]
        Description=Bind mount /var/nix to /nix
        Before=local-fs.target
        After=local-fs-pre.target
        Wants=local-fs-pre.target

        [Mount]
        What=/var/nix
        Where=/nix
        Type=none
        Options=bind

        [Install]
        WantedBy=local-fs.target
        EOF

        systemctl enable nix.mount

        echo "========================================"
        echo " Creating Nix installer"
        echo "========================================"

        mkdir -p /usr/libexec

        cat > /usr/libexec/install-nix-firstboot <<'EOF'
        #!/usr/bin/env bash

        set -euo pipefail

        MARKER="/var/lib/nix-installed"

        echo "========================================"
        echo " Nix first-boot installer"
        echo "========================================"

        if [[ -f "$MARKER" ]]; then
            echo "Nix is already installed."
            exit 0
        fi

        echo "Waiting for /nix mount..."

        for _ in {1..60}; do
            if mountpoint -q /nix; then
                break
            fi

            sleep 1
        done

        if ! mountpoint -q /nix; then
            echo "ERROR: /nix is not mounted."
            exit 1
        fi

        echo "/nix is mounted."

        echo "Checking network..."

        NETWORK_OK=false

        for _ in {1..60}; do
            if curl \
                --silent \
                --show-error \
                --fail \
                --connect-timeout 5 \
                --max-time 10 \
                https://nixos.org/ \
                >/dev/null 2>&1; then

                NETWORK_OK=true
                break
            fi

            sleep 2
        done

        if [[ "$NETWORK_OK" != true ]]; then
            echo "ERROR: Network is unavailable."
            exit 1
        fi

        echo "Network is available."

        echo "========================================"
        echo " Finding normal user"
        echo "========================================"

        USER_NAME=""
        USER_HOME=""

        while IFS=: read -r username _ uid _ _ home shell; do
            if [[ "$uid" -ge 1000 && "$uid" -lt 60000 ]]; then
                if [[ "$shell" != "/usr/sbin/nologin" ]] && \
                   [[ "$shell" != "/sbin/nologin" ]] && \
                   [[ -n "$home" ]]; then

                    USER_NAME="$username"
                    USER_HOME="$home"
                    break
                fi
            fi
        done < /etc/passwd

        if [[ -z "$USER_NAME" ]]; then
            echo "ERROR: No normal user found."
            exit 1
        fi

        echo "User: $USER_NAME"
        echo "Home: $USER_HOME"

        echo "========================================"
        echo " Preparing /nix permissions"
        echo "========================================"

        chown -R "$USER_NAME:$USER_NAME" /var/nix

        chmod 755 /var/nix
        chmod 755 /nix

        echo "========================================"
        echo " Installing Nix"
        echo "========================================"

        runuser -u "$USER_NAME" -- \
            env \
                HOME="$USER_HOME" \
                USER="$USER_NAME" \
                LOGNAME="$USER_NAME" \
                SHELL=/bin/bash \
                PATH=/usr/local/bin:/usr/bin:/bin \
            bash -c '
                set -euo pipefail

                export HOME="$HOME"
                export USER="$USER"
                export LOGNAME="$LOGNAME"
                export SHELL="$SHELL"

                echo "Running Nix installer as:"
                echo "  USER=$USER"
                echo "  HOME=$HOME"
                echo "  SHELL=$SHELL"

                if [[ -x "$HOME/.nix-profile/bin/nix" ]]; then
                    echo "Nix is already installed."
                    exit 0
                fi

                curl \
                    --proto "=https" \
                    --tlsv1.2 \
                    --fail \
                    --silent \
                    --show-error \
                    -L \
                    https://nixos.org/nix/install \
                    | sh -s -- --no-daemon
            '

        echo "========================================"
        echo " Verifying Nix installation"
        echo "========================================"

        runuser -u "$USER_NAME" -- \
            env \
                HOME="$USER_HOME" \
                USER="$USER_NAME" \
                LOGNAME="$USER_NAME" \
                SHELL=/bin/bash \
                PATH="$USER_HOME/.nix-profile/bin:/usr/local/bin:/usr/bin:/bin" \
            bash -c '
                set -euo pipefail

                if [[ -x "$HOME/.nix-profile/bin/nix" ]]; then
                    "$HOME/.nix-profile/bin/nix" --version
                    exit 0
                fi

                if [[ -x "$HOME/.local/state/nix/profiles/profile/bin/nix" ]]; then
                    "$HOME/.local/state/nix/profiles/profile/bin/nix" --version
                    exit 0
                fi

                echo "ERROR: Nix executable was not found."
                exit 1
            '

        echo "========================================"
        echo " Nix installation successful"
        echo "========================================"

        touch "$MARKER"

        exit 0
        EOF

        chmod 755 /usr/libexec/install-nix-firstboot

        echo "========================================"
        echo " Creating first-boot service"
        echo "========================================"

        cat > /etc/systemd/system/nix-firstboot.service <<'EOF'
        [Unit]
        Description=Install Nix on first boot

        Requires=nix.mount
        After=nix.mount

        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/libexec/install-nix-firstboot
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF

        systemctl enable nix-firstboot.service

        echo "========================================"
        echo " Nix first-boot configuration complete"
        echo "========================================"

  # ============================================================
  # Custom system configuration
  # ============================================================
  - type: script
    snippets:
      - |
        set -eux

        echo "=== Configuring Fish as default shell ==="

        sed -i \
          's|SHELL=/bin/bash|SHELL=/usr/bin/fish|' \
          /etc/default/useradd

        grep -qxF '/usr/bin/fish' /etc/shells \
          || echo '/usr/bin/fish' >> /etc/shells

        echo "=== Custom image build finished successfully! ==="

  # ============================================================
  # Image signing
  # ============================================================
  - type: signing
